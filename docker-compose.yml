services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: loopnow_cpa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d loopnow_cpa"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/loopnow_cpa
      LOOPNOW_DEMO_MODE: "true"
      MODEL_PROVIDER: ${MODEL_PROVIDER:-ollama}
      MODEL_NAME: ${MODEL_NAME:-qwen3:4b}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      CRA_RULESET_VERSION: ${CRA_RULESET_VERSION:-cra_current_2026}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
